<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>NewsManager – Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.33.0/dist/tabler-icons.min.css"/>
  <style>
    :root { --tblr-font-sans-serif: 'Segoe UI', system-ui, sans-serif; }
    .news-card { transition: transform .2s, box-shadow .2s; cursor: pointer; }
    .news-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .card-img-top { height: 180px; object-fit: cover; flex-shrink: 0; }
    .card-title-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
    .card-excerpt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 4.2em; }
    .sidebar-brand-name { font-weight: 700; font-size: 1.2rem; }
    .udp-badge { font-size: .7rem; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
    .modal-detail-img { width: 100%; max-height: 320px; object-fit: cover; border-radius: .5rem; }
  </style>
</head>
<body class="antialiased">
<div class="wrapper">
  <!-- Sidebar -->
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark">
        <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none text-white">
          <i class="ti ti-news fs-2"></i>
          <span class="sidebar-brand-name">NewsManager</span>
        </a>
      </h1>
      <div class="collapse navbar-collapse" id="navbar-menu">
        <ul class="navbar-nav pt-lg-3">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">
              <span class="nav-link-icon"><i class="ti ti-dashboard"></i></span>
              <span class="nav-link-title">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tin-tuc.html">
              <span class="nav-link-icon"><i class="ti ti-news"></i></span>
              <span class="nav-link-title">Tin tức</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="the-loai.html">
              <span class="nav-link-icon"><i class="ti ti-category"></i></span>
              <span class="nav-link-title">Thể loại</span>
            </a>
          </li>
        </ul>
        <div class="mt-auto pb-3">
          <div class="d-flex align-items-center gap-2 px-3">
            <span class="avatar avatar-sm bg-blue text-white">
              <i class="ti ti-server"></i>
            </span>
            <div>
              <div class="small fw-bold text-white">UDP Server</div>
              <div class="d-flex align-items-center gap-1">
                <span class="badge bg-green-lt udp-badge">:9999</span>
                <span class="badge bg-lime text-lime-fg udp-badge">
                  <span class="status-indicator status-indicator-animated status-green me-1"></span>
                  Online
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="page-wrapper">
    <!-- Topbar -->
    <div class="navbar-expand-md">
      <div class="collapse navbar-collapse" id="navbar-menu">
      </div>
    </div>
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <h2 class="page-title">Dashboard</h2>
            <div class="text-muted mt-1">Tổng quan hệ thống quản lý tin tức</div>
          </div>
          <div class="col-auto ms-auto">
            <div class="badge bg-azure-lt text-azure">
              <i class="ti ti-clock me-1"></i>
              <span id="clock"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-xl">
        <!-- Stat cards -->
        <div class="row row-deck row-cards mb-4" id="stat-cards">
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto">
                    <span class="bg-blue text-white avatar"><i class="ti ti-news"></i></span>
                  </div>
                  <div class="col">
                    <div class="font-weight-medium">Tổng tin tức</div>
                    <div class="text-muted" id="stat-total">...</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto">
                    <span class="bg-green text-white avatar"><i class="ti ti-category"></i></span>
                  </div>
                  <div class="col">
                    <div class="font-weight-medium">Thể loại</div>
                    <div class="text-muted" id="stat-loai">...</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto">
                    <span class="bg-yellow text-white avatar"><i class="ti ti-calendar"></i></span>
                  </div>
                  <div class="col">
                    <div class="font-weight-medium">Tin hôm nay</div>
                    <div class="text-muted" id="stat-today">...</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto">
                    <span class="bg-red text-white avatar"><i class="ti ti-wifi"></i></span>
                  </div>
                  <div class="col">
                    <div class="font-weight-medium">UDP Port</div>
                    <div class="text-muted">9999</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- News grid -->
        <div class="row mb-3 align-items-center">
          <div class="col">
            <h3 class="mb-0">Tin tức mới nhất <span id="tin-count" class="text-muted fs-5"></span></h3>
          </div>
          <div class="col-auto">
            <button id="btn-xem-tat-ca" class="btn btn-sm btn-primary" onclick="toggleXemTatCa()">
              <i class="ti ti-chevrons-down me-1"></i> Xem tất cả
            </button>
          </div>
        </div>

        <div class="row row-cards" id="news-grid">
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div>
            Đang tải dữ liệu từ UDP Server...
          </div>
        </div>
      </div>
    </div>

    <footer class="footer footer-transparent d-print-none">
      <div class="container-xl">
        <div class="row text-center align-items-center flex-row-reverse">
          <div class="col text-muted">
            NewsManager &copy; 2026 · Bài tập LTM · UDP Backend :9999
          </div>
        </div>
      </div>
    </footer>
  </div>
</div>

<!-- Modal xem chi tiết tin -->
<div class="modal modal-blur fade" id="modalChiTiet" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <span id="detail-badge" class="badge mb-1"></span>
          <h4 class="modal-title" id="detail-tieu-de"></h4>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="detail-anh" src="" class="modal-detail-img mb-3"
          onerror="this.style.display='none'">
        <p id="detail-noi-dung" class="text-muted" style="white-space:pre-wrap;line-height:1.8"></p>
      </div>
      <div class="modal-footer">
        <small class="text-muted me-auto">
          <i class="ti ti-calendar-event me-1"></i>
          <span id="detail-ngay"></span>
        </small>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>
<script>
const API = 'http://localhost:8080';
const BADGE_COLOR = { CN:'blue', TT:'green', KT:'yellow', GT:'red' };
const ICON_MAP = { CN:'laptop', TT:'ball-football', KT:'trending-up', GT:'device-tv' };

let loaiMap = {};
let allTins = [];
let showAll = false;

function toggleXemTatCa() {
  showAll = !showAll;
  const btn = document.getElementById('btn-xem-tat-ca');
  if (showAll) {
    btn.innerHTML = '<i class="ti ti-chevrons-up me-1"></i> Thu gọn';
    btn.classList.replace('btn-primary', 'btn-secondary');
    renderNews(allTins);
  } else {
    btn.innerHTML = '<i class="ti ti-chevrons-down me-1"></i> Xem tất cả';
    btn.classList.replace('btn-secondary', 'btn-primary');
    renderNews(allTins.slice(0, 6));
  }
}

function clock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('vi-VN') + ' ' + now.toLocaleDateString('vi-VN');
}
setInterval(clock, 1000); clock();

async function loadAll() {
  try {
    const [tinRes, loaiRes] = await Promise.all([
      fetch(API + '/api/tin'),
      fetch(API + '/api/loai')
    ]);
    allTins = await tinRes.json();
    const loais = await loaiRes.json();

    loais.forEach(l => loaiMap[l.ma] = l);

    const today = new Date().toISOString().slice(0, 10);
    const todayCount = allTins.filter(t => t.ngayDang === today).length;

    document.getElementById('stat-total').textContent = allTins.length + ' bài viết';
    document.getElementById('stat-loai').textContent = loais.length + ' danh mục';
    document.getElementById('stat-today').textContent = todayCount + ' bài viết';
    document.getElementById('tin-count').textContent = allTins.length > 6 ? `(đang hiện 6/${allTins.length})` : '';

    renderNews(allTins.slice(0, 6));
  } catch (e) {
    document.getElementById('news-grid').innerHTML =
      `<div class="col-12"><div class="alert alert-danger">
        <i class="ti ti-alert-circle me-2"></i>
        Không thể kết nối server. Hãy chạy <code>UDPServer</code> và <code>HttpBridge</code>.
      </div></div>`;
    document.getElementById('stat-total').textContent = '--';
    document.getElementById('stat-loai').textContent = '--';
    document.getElementById('stat-today').textContent = '--';
  }
}

function renderNews(tins) {
  if (!tins.length) {
    document.getElementById('news-grid').innerHTML = '<div class="col-12 text-center text-muted py-4">Chưa có tin tức</div>';
    return;
  }
  document.getElementById('news-grid').innerHTML = tins.map(t => {
    const loai = loaiMap[t.maLoai] || { ten: t.maLoai, mauBadge: 'blue' };
    const color = loai.mauBadge || BADGE_COLOR[t.maLoai] || 'blue';
    const icon = loai.icon || ICON_MAP[t.maLoai] || 'news';
    const imgSrc = t.linkAnh || `https://picsum.photos/seed/${t.ma}/400/200`;
    return `
    <div class="col-md-4">
      <div class="card news-card h-100" onclick='moModalChiTiet(${JSON.stringify(t)})'>
        <div class="ribbon ribbon-top ribbon-${color}">
          <i class="ti ti-${icon}"></i>
        </div>
        <img src="${imgSrc}" class="card-img-top" alt="${escHtml(t.tieuDe)}"
          onerror="this.src='https://picsum.photos/seed/${t.ma}/400/200'">
        <div class="card-body d-flex flex-column">
          <div class="mb-2">
            <span class="badge bg-${color}-lt text-${color}">${escHtml(loai.ten)}</span>
          </div>
          <h4 class="card-title card-title-clamp">${escHtml(t.tieuDe)}</h4>
          <p class="text-muted small flex-grow-1 card-excerpt">${escHtml(t.noiDung)}</p>
          <div class="d-flex align-items-center mt-2">
            <i class="ti ti-calendar-event text-muted me-1 small"></i>
            <small class="text-muted">${t.ngayDang}</small>
            <small class="text-muted ms-auto"><i class="ti ti-eye me-1"></i>Xem thêm</small>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function moModalChiTiet(t) {
  const loai = loaiMap[t.maLoai] || { ten: t.maLoai, mauBadge: 'blue' };
  const color = loai.mauBadge || 'blue';
  const imgSrc = t.linkAnh || `https://picsum.photos/seed/${t.ma}/400/200`;
  document.getElementById('detail-badge').className = `badge bg-${color}-lt text-${color} mb-1`;
  document.getElementById('detail-badge').textContent = loai.ten;
  document.getElementById('detail-tieu-de').textContent = t.tieuDe;
  document.getElementById('detail-noi-dung').textContent = t.noiDung;
  document.getElementById('detail-anh').src = imgSrc;
  document.getElementById('detail-anh').style.display = 'block';
  document.getElementById('detail-ngay').textContent = t.ngayDang;
  new bootstrap.Modal(document.getElementById('modalChiTiet')).show();
}

loadAll();
</script>
</body>
</html>
